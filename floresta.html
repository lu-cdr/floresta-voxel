<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floresta Voxel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
  /* Mesma família visual do ICQR: creme quente, terracota, Silkscreen na marca */
  :root {
    --bg: #ebe5d9; --panel: #fbf8f2; --ink: #29251f; --muted: #6c6455; --line: #dcd2c1;
    --chip: #efe8dc; --accent: #b5623a; --on-accent: #fff8f0;
    --shadow: 0 10px 30px rgba(60, 45, 25, .12), 0 1px 3px rgba(60, 45, 25, .08);
    --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --f-pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1916; --panel: #25221e; --ink: #f0e9dd; --muted: #9b917f; --line: #3a352d;
      --chip: #302c26; --accent: #dc8a58; --on-accent: #1b1410;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1916; --panel: #25221e; --ink: #f0e9dd; --muted: #9b917f; --line: #3a352d;
    --chip: #302c26; --accent: #dc8a58; --on-accent: #1b1410;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  body[data-tool="camera"] #scene { cursor: grab; }
  body:not([data-tool="camera"]) #scene { cursor: crosshair; }

  .brand {
    position: fixed; z-index: 2; top: 16px; left: 16px; pointer-events: none; display: grid; gap: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow);
  }
  .mark { font-family: var(--f-pixel); font-size: 20px; letter-spacing: .04em; }
  .brand p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 34ch; }
  .stats { font: 500 11.5px/1.5 var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* barra de ferramentas à esquerda */
  .tools {
    position: fixed; z-index: 3; left: 16px; top: 50%; transform: translateY(-50%);
    width: 208px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 10px; display: grid; gap: 10px;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .seg button {
    font: 600 12.5px/1 var(--f-body); color: var(--ink); background: var(--chip); border: 1px solid transparent;
    border-radius: 9px; padding: 9px 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; justify-content: center;
    transition: background-color .15s ease, transform .12s ease;
  }
  .seg button:hover:not(:disabled) { border-color: var(--line); }
  .seg button:disabled { opacity: .45; cursor: default; transform: none; }
  #histSeg button { font-weight: 500; padding: 7px 6px; }
  .seg button:active { transform: scale(.97); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .seg kbd { font: 500 10px/1 var(--f-pixel); color: var(--muted); }
  .seg button[aria-pressed="true"] kbd { color: inherit; }
  .row { display: grid; gap: 4px; }
  .row label { display: flex; justify-content: space-between; font: 500 11.5px/1 var(--f-body); color: var(--muted); }
  .row output { color: var(--ink); font-variant-numeric: tabular-nums; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row select { font: 500 12.5px var(--f-body); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .tools h2 { margin: 2px 0 0; font: 700 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .busy { font: 500 11.5px/1.3 var(--f-body); color: var(--accent); min-height: 1.3em; }

  /* relógio e estações, embaixo no centro */
  .clock {
    position: fixed; z-index: 3; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 12px; max-width: calc(100% - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    font: 500 12px/1.2 var(--f-body); color: var(--muted);
  }
  .clock .season { display: flex; align-items: center; gap: 9px; min-width: 128px; }
  .clock .season strong { display: block; font: 700 14px/1.1 var(--f-display); color: var(--ink); }
  .clock .season span { font-variant-numeric: tabular-nums; }
  .clock .swatch { width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); transition: background-color .4s ease; }
  .clock .hour { display: flex; align-items: center; gap: 8px; }
  .clock .hour output { font: 500 12px var(--f-pixel); color: var(--ink); min-width: 5ch; font-variant-numeric: tabular-nums; }
  .clock .hour input { width: 120px; accent-color: var(--accent); }
  .clock .steps { display: flex; gap: 4px; }
  .clock button {
    font: 600 12px/1 var(--f-body); color: var(--ink); background: var(--chip); border: 1px solid transparent;
    border-radius: 9px; padding: 8px 9px; cursor: pointer; white-space: nowrap; transition: background-color .15s ease, transform .12s ease;
  }
  .clock button:hover { border-color: var(--line); }
  .clock button:active { transform: scale(.97); }
  .clock .chk { display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
  .clock .chk input { accent-color: var(--accent); margin: 0; }

  .hint {
    position: fixed; z-index: 2; bottom: 80px; left: 50%; transform: translateX(-50%);
    font: 500 12px/1.3 var(--f-body); color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }

  /* menu de debug (lil-gui) com os tokens da página */
  .lil-gui.root {
    position: fixed; top: 12px; right: 12px; max-height: calc(100% - 96px); overflow-y: auto; z-index: 4; /* termina acima do relógio */
    border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .lil-gui {
    --background-color: var(--panel); --text-color: var(--ink); --title-background-color: var(--chip);
    --title-text-color: var(--ink); --widget-color: var(--chip); --hover-color: var(--line); --focus-color: var(--line);
    --number-color: var(--accent); --string-color: var(--accent); --font-family: var(--f-body); --font-size: 11.5px;
    --input-font-size: 11.5px; --padding: 5px; --widget-height: 21px; --name-width: 44%;
  }
  .lil-gui .title { font-weight: 600; }

  @media (max-width: 760px) {
    .tools { top: auto; bottom: 132px; transform: none; width: calc(100% - 32px); grid-template-columns: 1fr 1fr; }
    .hint { display: none; }
    .clock { width: calc(100% - 32px); flex-wrap: wrap; gap: 8px 12px; bottom: 12px; }
    .clock .hour { flex: 1; }
    .clock .hour input { width: 100%; }
    .clock .steps { order: 3; flex: 1 1 100%; }
    .clock .steps button { flex: 1; }
    .tools .seg { grid-column: 1 / -1; grid-template-columns: repeat(4, 1fr); }
    .tools #histSeg { grid-template-columns: 1fr 1fr; }
    .tools h2, .busy { grid-column: 1 / -1; }
    .brand p { display: none; }
    .lil-gui.root { width: min(300px, calc(100% - 24px)) !important; max-height: 45%; }
  }
</style>
</head>
<body data-tool="arvores">
<canvas id="scene" tabindex="0" aria-label="Cena 3D da floresta. Pinte árvores e grama com o pincel."></canvas>

<div class="brand">
  <div class="mark">FLORESTA VOXEL</div>
  <p>Pinte florestas inteiras. Ruído Perlin decide espaçamento, espécie, tamanho, formato e cor.</p>
  <div class="stats" id="stats"></div>
</div>

<div class="tools" role="toolbar" aria-label="Ferramentas">
  <div class="seg" id="toolSeg">
    <button data-tool="camera" aria-pressed="false">Câmera <kbd>C</kbd></button>
    <button data-tool="arvores" aria-pressed="true">Árvores <kbd>1</kbd></button>
    <button data-tool="grama" aria-pressed="false">Grama <kbd>2</kbd></button>
    <button data-tool="borracha" aria-pressed="false">Borracha <kbd>E</kbd></button>
  </div>
  <div class="seg" id="histSeg">
    <button id="bUndo" disabled aria-keyshortcuts="Control+Z" title="Nada para desfazer">↶ Desfazer</button>
    <button id="bRedo" disabled aria-keyshortcuts="Control+Shift+Z Control+Y" title="Nada para refazer">↷ Refazer</button>
  </div>
  <h2>Pincel</h2>
  <div class="row"><label for="bRadius">Raio <output id="oRadius"></output></label><input id="bRadius" type="range" min="1" max="24" step=".5" value="7"></div>
  <div class="row"><label for="bStrength">Força <output id="oStrength"></output></label><input id="bStrength" type="range" min=".05" max="1" step=".05" value=".6"></div>
  <div class="row"><label for="bHard">Dureza <output id="oHard"></output></label><input id="bHard" type="range" min="0" max="1" step=".05" value=".35"></div>
  <div class="row"><label for="bSpecies">Espécie</label>
    <select id="bSpecies"><option value="-1">Automática (ruído)</option></select>
  </div>
  <div class="row"><label for="bErase">Borracha apaga</label>
    <select id="bErase"><option value="ambos">árvores e grama</option><option value="arvores">só árvores</option><option value="grama">só grama</option></select>
  </div>
  <div class="busy" id="busy" aria-live="polite"></div>
</div>

<div class="clock" id="clock" role="group" aria-label="Tempo">
  <div class="season">
    <span class="swatch" id="cSwatch" aria-hidden="true"></span>
    <div><strong id="cSeason">Outono</strong><span id="cDay">dia 1 de 12</span></div>
  </div>
  <label class="hour"><output id="cHour">10:00</output><input id="cTime" type="range" min="0" max=".995" step=".005" aria-label="Hora do dia"></label>
  <div class="steps">
    <button data-days="1" title="Avançar um dia">+1 dia</button>
    <button data-days="7" title="Avançar uma semana">+1 semana</button>
    <button data-days="season" title="Ir para o primeiro dia da próxima estação">Próxima estação</button>
  </div>
  <label class="chk" title="As cores da floresta mudam com a estação"><input type="checkbox" id="cSeasonal"> Cores da estação</label>
</div>
<div class="hint" id="hint">Arraste para pintar · botão direito gira · roda dá zoom · Shift apaga · [ ] raio · Ctrl+Z desfaz</div>
<input type="file" id="fileProject" accept=".json,application/json" hidden>
<input type="file" id="fileStyle" accept=".json,application/json" hidden>

<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import GUI from 'lil-gui';
import { VegWorld, defaultProject, migrateProject, treeGeometry, bakedTreeMesh } from './veg-render.js';
import { SPECIES, SPECIES_KEYS, STYLES, SEASONS, seasonAt, seasonStyle, lightAt, genTreeVoxels, meshVoxels, variantSeed } from './veg-core.js';
import { History, snapshotLayers, makePatch, applyPatch } from './veg-history.js';

const $ = s => document.querySelector(s);
const canvas = $('#scene');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- renderer, cena, luz ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // sombra dura, como no ICQR
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xfffaf0, 0xb3a894, 1.05);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
scene.add(hemi, sun, sun.target);

const view = { showTrees: true, showGrass: true, sunAz: 35, sunI: 2.3, hemiI: 1.05, shadows: true, fog: true, iso: false, overlay: 'nenhum', autosave: true };

/* ---------- mundo ---------- */
let project = defaultProject();
const saved = store.get('floresta-voxel:projeto');
if (saved) { try { project = migrateProject(JSON.parse(saved)); } catch (e) { console.warn('Projeto salvo ignorado:', e.message); } }
const world = new VegWorld(scene, project);
if (!saved) { world.fillAll('arvores', 1); world.fillAll('grama', 1); }
let P = world.P;

/* ---------- câmeras ---------- */
const persp = new THREE.PerspectiveCamera(42, 1, .1, 800);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, -400, 800);
let camera = persp;
let controls;
const brush = { tool: 'arvores', radius: 7, strength: .6, hard: .35, species: -1, erase: 'ambos' };
function makeControls() {
  const prev = controls ? { t: controls.target.clone() } : null;
  controls?.dispose();
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * .47;
  controls.minDistance = 4; controls.maxDistance = 300;
  if (prev) controls.target.copy(prev.t);
  applyToolToControls();
}
function placeCamera() {
  const s = P.size;
  persp.position.set(s * .55, s * .5, s * .62);
  ortho.position.set(s, s * .82, s);
  ortho.zoom = 1;
  controls?.target.set(0, 0, 0);
}
placeCamera();
makeControls();

/* ---------- ferramentas e pincel ---------- */
function applyToolToControls() {
  const paint = brush.tool !== 'camera';
  controls.mouseButtons = paint
    ? { LEFT: -1, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE }
    : { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
  controls.touches = paint ? { ONE: -1, TWO: THREE.TOUCH.DOLLY_ROTATE } : { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
}
function setTool(t) {
  brush.tool = t;
  document.body.dataset.tool = t;
  document.querySelectorAll('#toolSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  ring.visible = t !== 'camera';
  applyToolToControls();
  $('#hint').textContent = t === 'camera'
    ? 'Arraste para girar · botão direito move · roda dá zoom'
    : 'Arraste para pintar · botão direito gira · roda dá zoom · Shift apaga · [ ] raio · Ctrl+Z desfaz';
}
document.querySelectorAll('#toolSeg button').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
for (const k of SPECIES_KEYS) $('#bSpecies').add(new Option(SPECIES[k].label, SPECIES_KEYS.indexOf(k)));
const bindRange = (id, out, key, fmt = v => v) => {
  const el = $(id), o = $(out);
  const sync = () => { brush[key] = +el.value; o.textContent = fmt(+el.value); };
  el.addEventListener('input', sync); sync();
  return v => { el.value = v; sync(); };
};
const setRadius = bindRange('#bRadius', '#oRadius', 'radius', v => v.toFixed(1));
bindRange('#bStrength', '#oStrength', 'strength', v => Math.round(v * 100) + '%');
bindRange('#bHard', '#oHard', 'hard', v => Math.round(v * 100) + '%');
$('#bSpecies').addEventListener('change', e => brush.species = +e.target.value);
$('#bErase').addEventListener('change', e => brush.erase = e.target.value);

// anel do pincel acompanhando o relevo
const RING_N = 72;
const ring = new THREE.LineLoop(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(RING_N * 3), 3)),
  new THREE.LineBasicMaterial({ color: 0xb5623a, depthTest: false, transparent: true, opacity: .9 }));
ring.renderOrder = 10; ring.frustumCulled = false; ring.visible = false;
scene.add(ring);
const cursor = { x: 0, z: 0, on: false };
function updateRing() {
  const p = ring.geometry.attributes.position;
  for (let i = 0; i < RING_N; i++) {
    const a = i / RING_N * Math.PI * 2, x = cursor.x + Math.cos(a) * brush.radius, z = cursor.z + Math.sin(a) * brush.radius;
    p.setXYZ(i, x, world.heightAt(x, z) + .08, z);
  }
  p.needsUpdate = true;
  ring.material.color.set(brush.tool === 'borracha' ? 0x6c6455 : getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
}

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pointers = new Set();
let painting = false, shiftDown = false;
const dirty = { trees: false, grass: null, colors: false, terrain: false, variants: 0, save: 0 };
const mergeBounds = (a, b) => !a ? b : { x0: Math.min(a.x0, b.x0), x1: Math.max(a.x1, b.x1), z0: Math.min(a.z0, b.z0), z1: Math.max(a.z1, b.z1) };

/* ---------- desfazer / refazer ----------
   Toda mudança nas máscaras vira um comando com o remendo do retângulo afetado
   (antes/depois), então desfazer não reconstrói o mundo, só a área tocada. */
const history = new History({ onChange: syncHistoryUi });
function markMasks(bounds, patch) {
  if (patch.after.trees || patch.after.species) dirty.trees = true;
  if (dirty.grass !== 'all') dirty.grass = mergeBounds(dirty.grass, bounds);
  dirty.colors = true;
  dirty.save = performance.now();
}
function maskCommand(label, before, bounds) {
  const rect = world.maskRect(bounds);
  const patch = rect && makePatch(world.maskLayers(), before, rect, world.maskN);
  if (!patch) return false;
  const put = which => { applyPatch(world.maskLayers(), patch, which, world.maskN); markMasks(bounds, patch); };
  history.push({ label, bytes: patch.bytes, apply: () => put('after'), revert: () => put('before') });
  return true;
}
// ação de mapa inteiro (preencher, limpar) passando pelo histórico
function maskAction(label, fn) {
  const before = snapshotLayers(world.maskLayers());
  fn();
  if (!maskCommand(label, before, world.bounds)) busy('Nada mudou.');
}
let stroke = null; // traço em andamento: { before, bounds, label }
function endStroke() {
  painting = false;
  if (stroke?.bounds) maskCommand(stroke.label, stroke.before, stroke.bounds);
  stroke = null;
}
function undo() {
  if (stroke) return;
  const c = history.undo();
  busy(c ? 'Desfeito: ' + c.label : 'Nada para desfazer.');
}
function redo() {
  if (stroke) return;
  const c = history.redo();
  busy(c ? 'Refeito: ' + c.label : 'Nada para refazer.');
}
function syncHistoryUi() {
  const u = $('#bUndo'), r = $('#bRedo');
  u.disabled = !history.canUndo; r.disabled = !history.canRedo;
  u.title = history.canUndo ? `Desfazer ${history.undoLabel} (Ctrl+Z)` : 'Nada para desfazer';
  r.title = history.canRedo ? `Refazer ${history.redoLabel} (Ctrl+Shift+Z)` : 'Nada para refazer';
}
$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);

function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return world.raycast(raycaster.ray);
}
let lastHit = null;
function stamp(e, first) {
  const hit = pick(e);
  if (!hit) return;
  cursor.x = hit.x; cursor.z = hit.z; cursor.on = true;
  const erase = brush.tool === 'borracha' || e.shiftKey;
  const layers = brush.tool === 'grama' ? ['grama'] : brush.tool === 'arvores' ? ['arvores']
    : brush.erase === 'ambos' ? ['arvores', 'grama'] : [brush.erase];
  const s = brush.strength * (erase ? 1 : .5);
  // carimbos espaçados ao longo do traço, para um arrasto rápido não deixar falhas
  const from = first || !lastHit ? hit : lastHit;
  const dist = Math.hypot(hit.x - from.x, hit.z - from.z), gap = Math.max(.5, brush.radius * .35);
  const n = Math.max(1, Math.ceil(dist / gap));
  for (let i = first ? 0 : 1; i <= n; i++) {
    const x = from.x + (hit.x - from.x) * i / n, z = from.z + (hit.z - from.z) * i / n;
    for (const L of layers) {
      const b = world.paint(L, x, z, brush.radius, s, brush.hard, erase, brush.species);
      if (L === 'arvores') dirty.trees = true;
      if (dirty.grass !== 'all') dirty.grass = mergeBounds(dirty.grass, b);
      if (stroke) stroke.bounds = mergeBounds(stroke.bounds, b);
    }
  }
  if (stroke && !stroke.label) stroke.label = erase ? 'borracha' : brush.tool === 'grama' ? 'pincel de grama' : 'pincel de árvores';
  lastHit = hit;
  dirty.colors = true;
  dirty.save = performance.now();
}
canvas.addEventListener('pointerdown', e => {
  pointers.add(e.pointerId);
  if (pointers.size > 1) { endStroke(); return; } // segundo dedo: vira gesto de câmera
  if (brush.tool !== 'camera' && e.button === 0) {
    painting = true;
    canvas.setPointerCapture(e.pointerId);
    stroke = { before: snapshotLayers(world.maskLayers()), bounds: null, label: '' };
    stamp(e, true);
  }
});
canvas.addEventListener('pointermove', e => {
  if (painting) stamp(e);
  else if (brush.tool !== 'camera') {
    const hit = pick(e);
    if (hit) { cursor.x = hit.x; cursor.z = hit.z; cursor.on = true; }
  }
});
const endPaint = e => { pointers.delete(e.pointerId); if (painting) endStroke(); };
canvas.addEventListener('pointerup', endPaint);
canvas.addEventListener('pointercancel', endPaint);
canvas.addEventListener('pointerleave', () => { cursor.on = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // campos de texto têm o próprio desfazer; slider, caixa e botão não
  const typing = e.target.closest?.('input:not([type=range]):not([type=checkbox]), select, textarea, .lil-gui');
  if (typing) return;
  if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'y')) {
    e.preventDefault();
    if (k === 'y' || e.shiftKey) redo(); else undo();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return; // não roubar atalhos do navegador
  if (k === 'c') setTool('camera');
  else if (k === '1') setTool('arvores');
  else if (k === '2') setTool('grama');
  else if (k === 'e') setTool('borracha');
  else if (k === '[') setRadius(Math.max(1, brush.radius - 1));
  else if (k === ']') setRadius(Math.min(24, brush.radius + 1));
});

/* ---------- aparência ---------- */
function applyLook() {
  const S = P.style, L = lightAt(P.ecology.dayTime, S);
  scene.background = new THREE.Color(L.sky);
  scene.fog = view.fog ? new THREE.Fog(L.fog, P.size * .9, P.size * 2.6) : null;
  hemi.color.set(S.hemiSky); hemi.groundColor.set(S.hemiGround); hemi.intensity = view.hemiI * L.hemiI;
  sun.color.set(L.sunColor); sun.intensity = view.sunI * L.sunI;
  const az = (view.sunAz + L.sunAz) * Math.PI / 180, el = L.sunEl * Math.PI / 180, D = P.size;
  sun.position.set(Math.cos(el) * Math.cos(az) * D, Math.sin(el) * D, Math.cos(el) * Math.sin(az) * D);
  sun.shadow.camera.up.set(0, 0, -1);
  const sh = sun.shadow.camera, e = P.size * .75;
  sh.left = sh.bottom = -e; sh.right = sh.top = e; sh.near = 1; sh.far = D * 3;
  sh.updateProjectionMatrix();
}

/* ---------- arquivos ---------- */
function download(name, data, type) {
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportGLB(obj, name) {
  busy('Gerando ' + name + '…');
  new GLTFExporter().parse(obj, glb => { download(name, new Blob([glb], { type: 'model/gltf-binary' })); busy(''); },
    err => { console.error(err); busy('Falhou: ' + err.message); }, { binary: true });
}
function exportOneTree(ex) {
  const tree = genTreeVoxels(ex.species, ex.formato, variantSeed(ex.species, 'x' + ex.formato, ex.variante, P.seed), P.style, P.species);
  const geo = treeGeometry(meshVoxels(tree, P.style.voxel));
  exportGLB(bakedTreeMesh(geo, null, ex.species), `${ex.species}-f${Math.round(ex.formato * 100)}-v${ex.variante}.glb`);
}
function exportLibrary() {
  const g = new THREE.Group(); g.name = 'vegetacao_voxel';
  let x = 0;
  for (const [key, v] of world.variants) {
    if (!v.ready) continue;
    const m = bakedTreeMesh(v.geo, null, key.replace(/:/g, '_'));
    m.position.x = x; x += 7;
    g.add(m);
  }
  if (!g.children.length) return busy('Nenhuma variante pronta ainda.');
  exportGLB(g, 'biblioteca-vegetacao.glb');
}
function exportScene() {
  const g = new THREE.Group(); g.name = 'floresta';
  const terrain = new THREE.Mesh(world.terrainMesh.geometry.clone(), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  terrain.name = 'terreno'; g.add(terrain);
  const bySpecies = new Map();
  let verts = 0;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  for (const t of world.trees) {
    const v = world.variants.get(t.key);
    if (!v?.ready) continue;
    verts += v.geo.attributes.position.count;
    if (verts > 6e6) { busy('Cena grande demais para um GLB só (> 6 mi de vértices). Use biblioteca + projeto .json.'); return; }
    const geo = bakedTreeMesh(v.geo, t.tint, '').geometry;
    geo.applyMatrix4(m.compose(new THREE.Vector3(t.x, t.y, t.z), q.setFromAxisAngle(up, t.rot), new THREE.Vector3().setScalar(t.scale)));
    if (!bySpecies.has(t.species)) bySpecies.set(t.species, []);
    bySpecies.get(t.species).push(geo);
  }
  for (const [sp, list] of bySpecies) {
    const mesh = new THREE.Mesh(mergeGeometries(list), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
    mesh.name = sp; g.add(mesh);
    list.forEach(x => x.dispose());
  }
  exportGLB(g, 'floresta.glb');
}
function readJSON(input, cb) {
  input.addEventListener('change', async () => {
    const f = input.files[0]; input.value = '';
    if (!f) return;
    try { cb(JSON.parse(await f.text())); } catch (e) { busy('Arquivo inválido: ' + e.message); }
  });
}
readJSON($('#fileProject'), j => {
  let next;
  try { next = migrateProject(j); } catch (e) { return busy(e.message); }
  Object.assign(world.P, next);

  placeCamera(); applyLook(); buildGui(); markTrees(); dirty.colors = true;
  applySeason(); syncClock(); applyLook();
  history.clear(); busy('Projeto aberto. O histórico começa daqui.');
});

let busyT = 0;
function busy(msg) { $('#busy').textContent = msg; clearTimeout(busyT); if (msg && !msg.endsWith('…')) busyT = setTimeout(() => $('#busy').textContent = '', 5000); }

/* ---------- relógio e estações ----------
   O tempo é ecology.tick (dias) + dayTime (hora). Avançar dias entra no histórico;
   a hora é só luz. Com "Cores da estação", o estilo é o preset da estação misturado
   com o da próxima nos últimos dias, recolorido sem refazer as árvores. */
const eco = () => P.ecology;
const hourLabel = t => { const m = Math.round(t * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
function syncClock() {
  const s = seasonAt(eco());
  $('#cSeason').textContent = s.label;
  $('#cDay').textContent = `dia ${s.day} de ${s.seasonLen}` + (s.year ? ` · ano ${s.year + 1}` : '');
  $('#cHour').textContent = hourLabel(eco().dayTime);
  $('#cTime').value = eco().dayTime;
  $('#cSeasonal').checked = !!eco().seasonal;
  $('#cSwatch').style.background = P.style.species.carvalho?.leaves?.[0] || P.style.terrain.grass;
}
function applySeason() {
  if (!eco().seasonal) return;
  const s = seasonStyle(eco(), { voxel: P.style.voxel });
  if (JSON.stringify(s) === JSON.stringify(P.style)) return; // no meio da estação nada muda
  world.setStyle(s, SEASONS[seasonAt(eco()).index].style); // já recolore o terreno
  applyLook(); buildGui();
}
function setTick(t) {
  eco().tick = Math.max(0, t);
  applySeason(); syncClock();
  dirty.save = performance.now();
}
function advance(days) {
  const from = eco().tick, to = from + days, before = seasonAt(eco()).index;
  setTick(to);
  const s = seasonAt(eco());
  const label = days === 1 ? 'avançar 1 dia' : days === 7 ? 'avançar 1 semana' : 'avançar estação';
  history.push({ label, apply: () => setTick(to), revert: () => setTick(from) });
  busy(s.index !== before ? `Chegou ${s.key === 'primavera' ? 'a' : 'o'} ${s.label}.` : `${s.label}, dia ${s.day}.`);
}
// estilo escolhido à mão vence a estação
function fixColors() {
  if (!eco().seasonal) return;
  eco().seasonal = false; syncClock();
  busy('Cores fixas no estilo escolhido. Marque "Cores da estação" para voltar.');
}
document.querySelectorAll('#clock [data-days]').forEach(b => b.addEventListener('click', () => {
  const d = b.dataset.days === 'season' ? eco().seasonLen - (eco().tick % eco().seasonLen) : +b.dataset.days;
  advance(d);
}));
$('#cTime').addEventListener('input', e => { eco().dayTime = +e.target.value; syncClock(); applyLook(); dirty.save = performance.now(); });
$('#cSeasonal').addEventListener('change', e => {
  eco().seasonal = e.target.checked;
  if (e.target.checked) { applySeason(); busy('As cores seguem a estação.'); }
  syncClock(); dirty.save = performance.now();
});

/* ---------- laço ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  persp.aspect = w / h; persp.updateProjectionMatrix();
  const s = P.size * .62;
  ortho.left = -s * w / h; ortho.right = s * w / h; ortho.top = s; ortho.bottom = -s; ortho.updateProjectionMatrix();
}
addEventListener('resize', resize);

let frames = 0, fpsT = performance.now();
function frame(now) {
  const t = now / 1000;
  if (dirty.terrain) { world.rebuildTerrain(); dirty.terrain = false; dirty.trees = true; dirty.grass = 'all'; }
  if (dirty.variants && now - dirty.variants > 250) { world.invalidateVariants(); dirty.variants = 0; }
  if (dirty.trees) { world.rescatterTrees(); dirty.trees = false; dirty.save = now; }
  if (dirty.grass) { world.rebuildGrass(dirty.grass === 'all' ? null : dirty.grass); dirty.grass = null; }
  if (dirty.colors) { world.recolorTerrain(); dirty.colors = false; }
  if (dirty.save && view.autosave && now - dirty.save > 1500) {
    store.set('floresta-voxel:projeto', JSON.stringify({ ...world.P, masks: world.packMasks() }));
    dirty.save = 0;
  }
  world.U.uPush.value.set(cursor.x, cursor.z, Math.max(1, brush.radius * .5), cursor.on && brush.tool !== 'camera' ? .5 : 0);
  world.update(t);
  if (ring.visible) updateRing();
  if (world.stats.fila) busy(`Gerando variantes… ${world.stats.fila} na fila`);
  else if ($('#busy').textContent.startsWith('Gerando variantes')) busy(''); // recolorir é rápido e visível: sem aviso
  controls.update();
  renderer.render(scene, camera);
  frames++;
  if (now - fpsT > 500) {
    stats.fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now;
    $('#stats').textContent = `${world.stats.arvores} árvores · ${world.stats.grama.toLocaleString('pt-BR')} lâminas · ${stats.fps} fps`;
  }
  requestAnimationFrame(frame);
}

applySeason();
buildGui();
applyLook();
syncClock();
resize();
setTool('arvores');
world.rescatterTrees();
world.rebuildGrass();
requestAnimationFrame(frame);
window.__world = world; // para depurar no console
</script>
</body>
</html>
